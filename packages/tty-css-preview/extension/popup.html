<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitesurf TTY CSS Preview</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Kitesurf</p>
      <h1>TTY CSS Preview</h1>
      <label for="level">Preview mode</label>
      <select id="level">
        <option value="0">Off</option>
        <option value="1">Level 1</option>
        <option value="2">Level 2</option>
      </select>
      <label class="toggle" for="show-grid">
        <input id="show-grid" type="checkbox" />
        <span>Show cell grid</span>
      </label>
      <p id="status" class="status">Reading server status...</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
