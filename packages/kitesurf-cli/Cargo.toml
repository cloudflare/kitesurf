[package]
name = "kitesurf"
version = "0.0.3"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
name = "kitesurf_playback"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
futures-util = "0.3"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "time",
  "sync",
  "io-std",
  "io-util",
  "net",
  "signal",
] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
wasmtime = { version = "36", default-features = false, features = [
  "runtime",
  "cranelift",
  "parallel-compilation",
] }

[dev-dependencies]
png = "0.18"
