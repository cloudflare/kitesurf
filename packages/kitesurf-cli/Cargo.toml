[package]
name = "kitesurf"
version = "0.0.3"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
name = "kitesurf_playback"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
futures-util = "0.3"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "time",
  "sync",
  "io-std",
  "io-util",
  "net",
  "signal",
] }
tokio-tungstenite = "0.27"
wasmtime = { version = "36", default-features = false, features = [
  "runtime",
  "cranelift",
  "parallel-compilation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Use the system certificate directory for Gateway-issued certificates without linking OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots-no-provider",
] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
# Gateway TLS inspection uses P-521 signatures, which ring cannot verify.
rustls = "0.23"

[target.'cfg(not(target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }

[dev-dependencies]
png = "0.18"
