[package]
name = "scene-host-wasm"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Scene replay wasm with a byte-oriented ABI for native clients"

[lib]
crate-type = ["cdylib"]

[features]
native-host = []
default = ["native-host"]
blitz = []
pdf = []

[dependencies]
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
vello_cpu = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }
image = { workspace = true }
jpeg-encoder = { workspace = true }
foldhash = "0.2"
png = { workspace = true }
fdeflate = { workspace = true }
crc32fast = { workspace = true }
wuff = { workspace = true }
flate2 = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
