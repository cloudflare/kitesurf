<!doctype html><html><body>
<div id="status">init</div>
<script type="module">
import { greet, HELPER_LOADED } from "./tla-import-helper.js";
window.__bug_helper_loaded = HELPER_LOADED;
window.__bug_greeting = greet("bug");
window.__bug_started = true;
const r = await fetch("/__fixtures/tla-import-helper.js");
const text = await r.text();
window.__bug_fetched_bytes = text.length;
window.__bug_completed = true;
document.getElementById("status").textContent =
  "bug-done:" + window.__bug_greeting + ":" + text.length;
</script>
</body></html>
