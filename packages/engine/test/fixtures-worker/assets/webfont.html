  <script>
    (function poll(tries) {
      var wf = document.getElementById("wf").getBoundingClientRect().width;

      if (wf !== fb || tries > 40) {
        var d = document.createElement("div");
        d.id = "done";
        document.body.appendChild(d);
        document.title = "FONTSETTLED";
        return;
      }
      setTimeout(function () { poll(tries + 1); }, 100);
    })(0);

      ctx.fillStyle = "#f00";
      ctx.font = "32px KsTestMono";
      ctx.fillText("WebFont123.test", 5, 40);
      setTimeout(function () { document.title = "BRANDDRAWN"; }, 300);
