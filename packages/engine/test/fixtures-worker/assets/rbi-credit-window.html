<!doctype html>
<html>
<head><meta charset="utf-8"><title>rbi credit window</title>
<style>
  /* CSS animation: repaints every frame (genuine pixel damage) without
     bumping the mutation seq, so RBI scenes keep flowing while all
     sharing one seq — the per-frame credit-counting contract. */
  @keyframes pulse {
    from { opacity: 1; }
    to { opacity: 0.25; }
  }
  body { margin: 0; }
  #pulse {
    width: 120px;
    height: 120px;
    background: #c00;
    animation: pulse 1.2s ease-in-out infinite alternate;
  }
</style></head>
<body><div id="pulse"></div></body>
</html>
