<!doctype html>
<html><head><meta charset="utf-8"><title>seam-pending</title></head>
<body><div id="out"></div>
<script type="module">
import "./seam-plain-runtime.js";
const n = "route";
import("./seam-plain-" + n + ".js").catch(function (e) {
  document.title = "SEAM:" + JSON.stringify({ loaded: false, error: String((e && e.message) || e) });
});
setTimeout(function () {
  if (document.title.indexOf("SEAM:") !== 0) {
    document.title = "SEAM:" + JSON.stringify({ loaded: false, error: "timeout waiting for route chunk" });
  }
}, 8000);
</script></body></html>
