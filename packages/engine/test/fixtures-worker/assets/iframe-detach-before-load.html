<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<iframe id="doomed" src="/__fixtures/slow-iframe-child?ms=600"></iframe>
<script>
  // Remove the iframe while its parent-side fetch is still in flight
  // (the src holds headers for 600ms). The parent then takes its
  // f.detached bail and never sends this frame's
  // installIframeContent — so `load` must be released by the settle
  // signal, not by the drain's 5s bug budget.
  document.getElementById("doomed").remove();
  window.__loadAt = null;
  window.__t0 = Date.now();
  addEventListener("load", function () {
    window.__loadAt = Date.now() - window.__t0;
  });
</script>
</body>
</html>
