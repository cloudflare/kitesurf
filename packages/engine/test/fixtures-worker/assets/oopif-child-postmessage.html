<!doctype html>
<html><head><meta charset="utf-8" /><title>oopif-child-postmessage</title></head>
<body style="margin:0;background:#eeeeee">
<script>
window.__msgs = [];
window.addEventListener("message", function (e) {
  window.__msgs.push({ data: e.data, origin: e.origin, sourceIsParent: e.source === window.parent });
});
window.__parentIsSelf = (window.parent === window);
window.parent.postMessage({ hello: "from-child", n: 1 }, "*");
// Mismatched targetOrigin must be dropped by the engine-side gate.
window.parent.postMessage({ hello: "wrong-origin" }, "https://evil.example");
</script>
</body></html>
