<!doctype html><title>ce-mixin-late</title><body>
<my-mixed-widget></my-mixed-widget>
<script type="module">
// Production bundles commonly wrap HTMLElement before defining components.
let constructingNested = false;
globalThis.HTMLElement = class WrappedHTMLElement extends HTMLElement {
  constructor() {
    if (!constructingNested) {
      constructingNested = true;
      try { document.createElement("my-nested-widget"); }
      finally { constructingNested = false; }
    }
    super();
  }
};
setTimeout(() => {
  import('./ce-mixin-chunk.js').then(() => { window.__chunkLoaded = true; });
}, 50);
</script>
</body>
