<!doctype html>
<html><head><meta charset="utf-8" /><title>swap</title></head>
<body id="b" style="margin:0;background:#ff0000">
<div id="d" style="width:100%;height:100vh;background:#ff0000"></div>
<script>
  // Swap to green ~250ms after load. The main-frame load event
  // fires after this iframe's initial render, so the parent's first
  // screenshot samples red. Subsequent screenshots (or a screencast
  // frame after ~500ms) sample green — proving the OOPIF re-render
  // trigger picked up the child's setTimeout-driven mutation.
  setTimeout(function () {
    document.body.style.background = "#00ff00";
    document.getElementById("d").style.background = "#00ff00";
  }, 250);
</script>
</body></html>
