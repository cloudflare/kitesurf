<!doctype html>
<html>
<head><meta charset="utf-8" /><title>kitesurf inserted-script fixture</title></head>
<body>
<script>
(function () {
  var events = [];
  function insert(src) {
    var s = document.createElement("script");
    s.src = src;
    s.onload = function () { events.push("load:" + src); };
    s.onerror = function () { events.push("error:" + src); };
    document.head.appendChild(s);
  }
  window.__insertedRan = false;
  insert("/__fixtures/inserted-ok.js");
  insert("/__fixtures/inserted-missing.js");
  // The connection drops mid-response, so the fetch has no usable response.
  insert("/__fixtures/dropped-script.js");
  // Report late enough that every one of the three has settled.
  setTimeout(function () {
    document.title = "INSERTED:" + JSON.stringify({
      ran: window.__insertedRan,
      events: events.sort(),
    });
  }, 6000);
})();
</script>
</body>
</html>
