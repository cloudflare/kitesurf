<!doctype html>
<html>
<head><meta charset="utf-8"><title>img dimensions fixture</title></head>
<body>
<img id="s1" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'></svg>">
<img id="s2" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 200'></svg>">
<img id="s3" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' viewBox='0 0 600 200'></svg>">
<img id="s4" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='40'></svg>">
<img id="r1" width="10" height="10" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGM8ISfHAANMDEgANwcANHYBDK9qubUAAAAASUVORK5CYII=">
<img id="r2" style="display:block" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGM8ISfHAANMDEgANwcANHYBDK9qubUAAAAASUVORK5CYII=">
<p id="status">init</p>
<script>
  window.addEventListener("load", function () {
    var report = {};
    function nat(id) {
      var e = document.getElementById(id);
      return e.naturalWidth + "x" + e.naturalHeight;
    }
    report.svgDefault = nat("s1") === "300x150";
    report.svgViewBoxRatio = nat("s2") === "300x100";
    report.svgWidthPlusRatio = nat("s3") === "60x20";
    report.svgBothAttrs = nat("s4") === "60x40";
    report.rasterNatural = nat("r1") === "4x4";
    var r1 = document.getElementById("r1");
    report.rasterRenderedWidth = r1.width === 10;
    r1.style.display = "none";
    r1.getBoundingClientRect();
    report.rasterHiddenWidthFromAttr = r1.width === 10;
    r1.removeAttribute("width");
    report.rasterHiddenWidthFromNatural = r1.width === 4;
    var r2 = document.getElementById("r2");
    report.blockImgNotStretched = r2.width === 4 && r2.getBoundingClientRect().width === 4;
    globalThis.__imgReport = JSON.stringify(report);
    document.getElementById("status").textContent = "done";
  });
</script>
</body>
</html>
