<!doctype html>
<html><head><meta charset="utf-8" /><title>oopif-child-worker</title></head>
<body>
<script>
// The worker's outcome must reach THIS frame's Worker object, never the
// embedding page's.
var worker = new Worker(URL.createObjectURL(new Blob(["postMessage('up')"])));
worker.onmessage = function (e) {
  window.parent.postMessage({ worker: "message", data: e.data }, "*");
};
worker.onerror = function (e) {
  window.parent.postMessage({ worker: "error", message: e.message }, "*");
};
</script>
</body></html>
