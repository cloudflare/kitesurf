<!doctype html>
<html>
<head><meta charset="utf-8"><title>RBI navigation damage</title></head>
<body style="margin:0">
<div id="box" style="width:40px;height:40px;background:#c00"></div>
<script>
  let red = true;
  setInterval(() => {
    red = !red;
    document.getElementById("box").style.backgroundColor = red ? "#c00" : "#00c";
  }, 150);
  addEventListener("keydown", (event) => {
    if (event.key === "r") location.href = location.href;
  });
</script>
</body>
</html>
