<!doctype html><title>dynprobe-graph</title><body>
<pre id="results" data-done="0"></pre>
<script type="module">
import { btoken } from './graphprobe/g-baked.js';
import bdefault from './graphprobe/g-baked-default.js';
globalThis.__ks_graphprobe_baked = btoken + ':' + typeof bdefault;
</script>
<script>
const EXPECTED = {
  g1: 'hello-x', g2: 'jsx-y', g3: 'jsx-r', g4: 'jsx-s', g5: 'jsx-n',
  g6: 'C', g7: 'B(A)+A', g8: 'bfn-1', g9: 'bm-2', g10: 'bc-3',
  g11: 'el:div', g12: 'v:k', g15: 'jx:p', g16: 'bd-d', g17: 'sap:gsap:a b',
  gc1: 'sh-lf:c1', gc2: 'sh-lf:c2', gc3: 'sh-lf:c3',
  gc4: 'sh-lf:c4', gc5: 'sh-lf:c5', gc6: 'sh-lf:c6',
  g18: 'static-ns', g19: 'static-cls',
};
const V8_READ = {
  g18: (m) => m.NS.Provider.instance(),
  g19: (m) => m.P.instance(),
};
const trim = (e) => String((e && e.message) || e).slice(0, 220);
const names = Object.keys(EXPECTED);
Promise.all(names.map((n) =>
  Promise.race([
    import('./graphprobe/' + n + '.js').then(
      (m) => {
        const got = V8_READ[n] ? V8_READ[n](m) : m.value;
        return got === EXPECTED[n]
          ? { ok: true }
          : { ok: false, err: 'value mismatch: ' + String(got) + ' (want ' + EXPECTED[n] + ')' };
      },
    ).catch((e) => ({ ok: false, err: trim(e) })),
    new Promise((r) => setTimeout(() => r({ ok: false, err: 'probe timeout' }), 20000)),
  ]),
)).then((vals) => {
  const out = {};
  names.forEach((n, i) => { out[n] = vals[i]; });
  const el = document.getElementById('results');
  el.textContent = JSON.stringify(out);
  el.setAttribute('data-done', '1');
});
</script></body>
