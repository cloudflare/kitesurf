<!doctype html>
<html>
<head><title>pending</title></head>
<body>
<p>inserted-bake</p>
<script>
  var src = new URLSearchParams(location.search).get("src") || "/__fixtures/inserted-bake.js";
  if (src === "none") document.title = "BAKE:none";
  var s = document.createElement("script");
  s.src = src;
  s.onload = function () {
    document.title = "BAKE:" + JSON.stringify({
      native: window.__insertedNative,
      runs: window.__insertedRuns,
      hello: typeof window.insertedHello === "function" ? window.insertedHello() : null,
      current: window.__insertedCurrentSrc,
      strict: window.__insertedStrict,
    });
  };
  s.onerror = function () { document.title = "BAKE:error"; };
  if (src !== "none") document.head.appendChild(s);
</script>
</body>
</html>
