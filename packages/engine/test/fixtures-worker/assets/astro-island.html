<!doctype html><title>astro-island</title><body>
<astro-island component-url="/__fixtures/astro-island-component.js"></astro-island>
<script>
const island = document.querySelector('astro-island');
import(island.getAttribute('component-url')).then(
  (m) => { document.body.dataset.native = String(m.native); },
  (e) => { document.body.dataset.native = 'error: ' + e; },
);
</script></body>
