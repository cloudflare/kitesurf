<style>
  body { margin: 0 }
  #box { width: 300px; height: 80px; padding: 10px; border: 5px solid #000 }
  #hidden { display: none }
  /* Four different border widths, so a clientTop/clientLeft that reads the
     wrong edge cannot come out looking correct. */
  #asym { width: 40px; height: 40px; border-style: solid; border-color: #000;
          border-width: 7px 11px 13px 3px }
</style>
<div id="box">box</div>
<div id="hidden">hidden</div>
<div id="asym"></div>
<script>
  globalThis.__ks_ro = [];
  const ro = new ResizeObserver((entries) => {
    for (const e of entries) {
      globalThis.__ks_ro.push([Math.round(e.contentRect.width), Math.round(e.contentRect.height)]);
    }
  });
  ro.observe(document.getElementById("box"));
  globalThis.__ks_grow = () => { document.getElementById("box").style.width = "500px"; };
</script>
