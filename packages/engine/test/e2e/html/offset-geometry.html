<style>
  /* body keeps its default 8px margin on purpose: offsets of
     body-parented elements must be ICB-relative, not body-relative. */
  #rel { position: relative; margin-top: 12px; border: 4px solid #999; padding: 6px; width: 300px; height: 200px }
  #inner { margin-top: 10px; margin-left: 20px; width: 100px; height: 40px; background: #ccf }
  #abs { position: absolute; top: 25px; left: 35px; width: 50px; height: 20px; background: #fcc }
  #scroller { overflow: scroll; height: 100px; position: relative; margin-top: 8px }
  #spacer { height: 200px }
  #after { height: 30px; background: #cfc }
  #fixed { position: fixed; top: 5px; left: 7px; width: 40px; height: 16px }
  table { border-collapse: collapse; margin-top: 8px }
  td { padding: 3px; border: 1px solid #000 }
</style>
<div id="first" style="height: 50px">first</div>
<div id="rel">
  <div id="inner">inner</div>
  <div id="abs">abs</div>
</div>
<div id="scroller">
  <div id="spacer"></div>
  <div id="after">after</div>
</div>
<div id="fixed">fixed</div>
<div id="contents" style="display: contents"><span>flattened</span></div>
<table><tr><td id="cell"><span id="incell">x</span></td></tr></table>
