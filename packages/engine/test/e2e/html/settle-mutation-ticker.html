<title>settle mutation ticker</title>
<h1 id="h">mutating</h1>
<script>
  window.addEventListener("load", function () {
    var n = 0;
    function tick() {
      n++;
      document.getElementById("h").setAttribute("data-tick", String(n));
      globalThis.__ks_mine++;
      setTimeout(tick, 0);
    }
    globalThis.__ks_mine++;
    setTimeout(tick, 0);
    document.title = "MUTATION_TICKER_READY";
  });
</script>
