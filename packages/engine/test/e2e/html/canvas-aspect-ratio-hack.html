<style>
  body { margin: 0; background: #808080; }
  #wrap { position: absolute; left: 0; top: 0; width: 200px; height: 0; padding-bottom: 75%; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; }
</style>
<div id="wrap"><canvas id="cv" width="200" height="150"></canvas></div>
<script>
(function () {
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(0, 0, 200, 150);
  setTimeout(function () {
    var r = cv.getBoundingClientRect();
    document.title = "CANVASASPECT:" + JSON.stringify({ w: Math.round(r.width), h: Math.round(r.height) });
  }, 300);
})();
</script>
