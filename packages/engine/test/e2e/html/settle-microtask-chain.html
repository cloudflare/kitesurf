<title>settle microtask chain</title>
<h1 id="h">chain</h1>
<script>
  window.addEventListener("load", function () {
    var p = Promise.resolve();
    for (var i = 0; i < 12; i++) {
      p = p.then(function () {
        return null;
      });
    }
    p.then(function () {
      document.getElementById("h").setAttribute("data-step", "deep");
      document.title = "CHAIN_SETTLED";
    });
  });
</script>
