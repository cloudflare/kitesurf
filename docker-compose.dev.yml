services:
  tracing:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      # Loopback only: the collector is unauthenticated and stores page text
      # and request URLs. Docker publishes 0.0.0.0 when the host IP is omitted.
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"
