name: Docker image

on:
  push:
    # Engine releases are date versions (2026.11.10); `v*` tags release the CLI.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # Authenticates the job to bazelflare (bazel/bazelflare/credential-helper).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          bazelflare: "true"
          pnpm-cache: "false"
      # The bundle is the same on every platform. Build it once with Bazel here, and give it to
      # docker/Dockerfile as its `engine` stage, so the image build skips its own Bazel build.
      - name: Build the engine
        run: |
          set -euo pipefail
          bazel build //docker:engine
          mkdir -p "$RUNNER_TEMP/engine"
          cp -RL bazel-bin/packages/engine/dist bazel-bin/packages/engine/public \
            bazel-bin/docker/config.capnp bazel-bin/docker/env.sh "$RUNNER_TEMP/engine/"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: engine=${{ runner.temp }}/engine
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
