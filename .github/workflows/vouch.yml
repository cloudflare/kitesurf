name: Vouch

on:
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/VOUCHED.td
      - .github/workflows/vouch.yml

permissions:
  contents: read

concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/recheck-vouch')))
      && format('vouch-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('vouch-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  collect-targets:
    if: >-
      github.repository_owner == 'cloudflare' &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/recheck-vouch')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
    steps:
      - id: collect
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            let targets;
            if (context.eventName === "pull_request_target") {
              const pr = context.payload.pull_request;
              targets = [{ number: pr.number, user: pr.user.login }];
            } else if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              targets = [{ number: issue.number, user: issue.user.login }];
            } else {
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: "open",
                per_page: 100,
              });
              targets = pulls.map((pr) => ({ number: pr.number, user: pr.user.login }));
            }
            core.setOutput("targets", JSON.stringify(targets));

  label:
    name: Label PR ${{ matrix.target.number }}
    needs: collect-targets
    if: >-
      github.repository_owner == 'cloudflare' &&
      needs.collect-targets.result == 'success' &&
      needs.collect-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.collect-targets.outputs.targets) }}
    steps:
      - id: vouch
        name: Check author trust
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1
        with:
          user: ${{ matrix.target.user }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update labels and respond
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ matrix.target.number }}
          AUTHOR: ${{ matrix.target.user }}
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
          VOUCHED: ${{ steps.vouch.outputs.vouched }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const author = process.env.AUTHOR;
            const status = process.env.VOUCH_STATUS;

            const labels = [
              { name: "vouch:trusted", color: "1f883d", description: "Author is vouched, a collaborator, or a bot." },
              { name: "vouch:unvouched", color: "fbca04", description: "Author is not vouched; CI waits for a maintainer." },
              { name: "vouch:denounced", color: "d1242f", description: "Author is blocked by the vouched list." },
              { name: "ci:approved", color: "0e8a16", description: "Maintainer approved CI for this unvouched PR." },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const next =
              status === "denounced"
                ? "vouch:denounced"
                : process.env.VOUCHED === "true"
                  ? "vouch:trusted"
                  : "vouch:unvouched";
            const managed = new Set(["vouch:trusted", "vouch:unvouched", "vouch:denounced"]);
            if (status === "denounced") managed.add("ci:approved");

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            for (const { name } of current) {
              if (!managed.has(name) || name === next) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!current.some((label) => label.name === next)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [next] });
            }

            const isOpenOrReopen =
              context.eventName === "pull_request_target" &&
              (context.payload.action === "opened" || context.payload.action === "reopened");
            if (!isOpenOrReopen) return;

            if (status === "unknown") {
              const marker = "<!-- vouch-unvouched -->";
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              if (comments.some((comment) => comment.body?.includes(marker))) return;

              const { data: file } = await github.rest.repos.getContent({
                owner,
                repo,
                path: ".github/vouch-pr-response.md",
                ref: context.payload.repository.default_branch,
              });
              const template = Buffer.from(file.content, "base64").toString("utf8");
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `${marker}\n${template.replaceAll("{author}", author)}`,
              });
            } else if (status === "denounced") {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `This pull request was closed because @${author} is blocked from contributing to this repository. See CONTRIBUTING.md.`,
              });
              await github.rest.pulls.update({ owner, repo, pull_number: issue_number, state: "closed" });
            }
