name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The e2e, Playwright and WPT suites need more memory than a standard hosted runner has, so CI runs
# only the build and the lighter lanes. Run the others locally (AGENTS.md, "Running").
jobs:
  # One job, so the Rust crates compile once: the tests and the dev build share one Bazel output
  # tree, and the checks, the lint tests, the Rust host tests and the vitest suite one invocation.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
      - run: pnpm install --frozen-lockfile
      - run: bazel test --keep_going --test_output=errors //:check //:rust_lint //packages/core:host_tests //packages/engine:vitest
      - run: pnpm run build
      - name: Fail on generated drift
        run: git diff --exit-code
      - run: pnpm run format:check
      - run: pnpm run lint:js
      - run: bazel run //scripts:workspace_checks
      - if: always()
        run: df -h /
      # Only main saves, so PR runs cannot evict main's entry from the 10 GB repository quota. Save
      # after a failure too: the actions that did finish are still valid cache entries.
      - if: >-
          !cancelled() && github.ref == 'refs/heads/main' && steps.setup.outputs.bazel-cache-key != ''
          && steps.setup.outputs.bazel-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.setup.outputs.bazel-cache-key }}
