name: CI

on:
  pull_request:
    # labeled/unlabeled re-evaluate the gate when a maintainer adds or removes ci:approved.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The e2e suite, the Playwright and Puppeteer lanes and the WPT gate run on bazelflare's executors.
jobs:
  # One job, so the Rust crates compile once: the tests and the dev build share one Bazel output
  # tree, and the checks, the lint tests, the Rust host tests and the vitest suite one invocation.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Authenticates the job to bazelflare (bazel/bazelflare/credential-helper).
      id-token: write
    steps:
      # The vouch workflow labels PRs, but labels it adds with GITHUB_TOKEN do not trigger a
      # labeled run, so this gate checks the author directly. A required check counts a
      # skipped job as passing, so an unapproved PR must fail this job rather than skip it.
      - id: vouch
        name: Check author trust
        if: github.event_name == 'pull_request'
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1
        with:
          user: ${{ github.event.pull_request.user.login }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require vouch or maintainer approval
        if: >-
          github.event_name == 'pull_request' &&
          (steps.vouch.outputs.status == 'denounced' ||
          contains(github.event.pull_request.labels.*.name, 'vouch:denounced') ||
          (steps.vouch.outputs.vouched != 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'ci:approved')))
        run: |
          echo "::error::This pull request is from an unvouched or denounced author. A maintainer must add the ci:approved label before CI runs."
          exit 1
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          bazelflare: "true"
      - run: pnpm install --frozen-lockfile
      - run: bazel test --keep_going --test_output=errors //:check //:rust_lint //packages/core:host_tests //packages/engine:vitest
      - run: pnpm run build
      - name: Fail on generated drift
        run: git diff --exit-code
      - run: pnpm run format:check
      - run: pnpm run lint:js
      - run: bazel run //scripts:workspace_checks
      - if: always()
        run: df -h /
      # Only main saves, so PR runs cannot evict main's entry from the 10 GB repository quota. Save
      # after a failure too: the actions that did finish are still valid cache entries.
      - if: >-
          !cancelled() && github.ref == 'refs/heads/main' && steps.setup.outputs.bazel-cache-key != ''
          && steps.setup.outputs.bazel-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.bazel-cache-paths }}
          key: ${{ steps.setup.outputs.bazel-cache-key }}

  # The e2e, wpt, playwright and puppeteer jobs are separate checks, rerun on their own when they
  # flake; on bazelflare they share the ci job's actions, so the engine compiles once. They save no
  # cache: the ci job saves the same key on main.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Authenticates the job to bazelflare (bazel/bazelflare/credential-helper).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          bazelflare: "true"
          pnpm-cache: "false"
      # Each test file is its own action on a bazelflare executor. The suite needs more memory than
      # a hosted runner has, so a fork's pull request skips it and main runs it once it merges.
      - if: steps.setup.outputs.bazelflare == 'true'
        run: bazel test --keep_going --test_output=errors //tests/e2e:gate
      - if: always() && steps.setup.outputs.bazelflare == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit
          path: bazel-testlogs/packages/engine/test/e2e/gate/test.xml
          if-no-files-found: ignore

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Authenticates the job to bazelflare (bazel/bazelflare/credential-helper).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          bazelflare: "true"
          pnpm-cache: "false"
      # Each spec boots an engine on a bazelflare executor, whose image holds the pinned Playwright
      # checkout. A fork's pull request has no bazelflare, so main runs the lane once it merges.
      - if: steps.setup.outputs.bazelflare == 'true'
        run: bazel test --keep_going --test_output=errors //tests/pw:specs //tests/pw:expectations_test
      - if: always() && steps.setup.outputs.bazelflare == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: bazel-testlogs/scripts/pw_expectations_test/test.xml
          if-no-files-found: ignore

  puppeteer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Authenticates the job to bazelflare (bazel/bazelflare/credential-helper).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          bazelflare: "true"
          pnpm-cache: "false"
      # Each spec boots an engine on a bazelflare executor, whose image holds the pinned Puppeteer
      # checkout. A fork's pull request has no bazelflare, so main runs the lane once it merges.
      - if: steps.setup.outputs.bazelflare == 'true'
        run: bazel test --keep_going --test_output=errors //tests/pptr:specs //tests/pptr:expectations_test
      - if: always() && steps.setup.outputs.bazelflare == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: puppeteer-junit
          path: bazel-testlogs/scripts/pptr_expectations_test/test.xml
          if-no-files-found: ignore

  wpt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Authenticates the job to bazelflare (bazel/bazelflare/credential-helper).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          bazelflare: "true"
          pnpm-cache: "false"
      # The buckets run on bazelflare's WPT executors, whose image holds the pinned corpus. A fork's
      # pull request has no bazelflare, so main runs the gate once it merges.
      - if: steps.setup.outputs.bazelflare == 'true'
        run: scripts/wpt-ci.sh
      - if: always() && steps.setup.outputs.bazelflare == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wpt-junit
          path: bazel-testlogs/scripts/wpt_expectations_test/test.xml
          if-no-files-found: ignore
