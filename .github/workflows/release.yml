name: Release CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - run: rustup target add ${{ matrix.target }}
      - name: Build the kitesurf CLI
        run: cargo build --release --locked --manifest-path packages/kitesurf-cli/Cargo.toml --target ${{ matrix.target }}
      - name: Install notice collector
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Package and checksum
        run: |
          set -euo pipefail
          NAME="kitesurf-${GITHUB_REF_NAME}-${{ matrix.target }}"
          PACKAGE="$RUNNER_TEMP/$NAME"
          mkdir -p dist
          mkdir -p "$PACKAGE/packages/engine/public/fonts" "$PACKAGE/scripts/lint" "$PACKAGE/vendor/wasm-memprof"
          cp "packages/kitesurf-cli/target/${{ matrix.target }}/release/kitesurf" LICENSE NOTICE "$PACKAGE/"
          cp packages/kitesurf-cli/Cargo.lock "$PACKAGE/Cargo.lock"
          cp -R licenses "$PACKAGE/licenses"
          cp packages/engine/public/fonts/OFL.txt packages/engine/public/fonts/Inter-OFL.txt "$PACKAGE/packages/engine/public/fonts/"
          cp scripts/lint/ANTI_SLOP_LICENSE.txt "$PACKAGE/scripts/lint/"
          cp vendor/wasm-memprof/LICENSE "$PACKAGE/vendor/wasm-memprof/"
          cargo about generate --locked --fail --config about.toml --manifest-path packages/kitesurf-cli/Cargo.toml --target "${{ matrix.target }}" --output-file "$PACKAGE/THIRD_PARTY_NOTICES.md" scripts/rust-notices.hbs
          tar -czf "dist/$NAME.tar.gz" -C "$PACKAGE" .
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
